server:
  port: 8086
spring:
  application:
    name: soutenance-service
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL_SOUTENANCE:jdbc:postgresql://localhost:5432/soutenance_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:1234}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${DB_DDL_AUTO:create}
    properties:
      hibernate:
        format_sql: true
        jdbc.lob.non_contextual_creation: true
    show-sql: false
  jackson:
    serialization:
      WRITE_DATES_AS_TIMESTAMPS: false

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  jwt:
    issuer: serviceAuth
    secret: ${APP_JWT_SECRET:T1Yt9cV5yZ0R3Q0p4uHn8Aq2Lw7mN3sX6pB4dF1kJ9rE2tV8cH5qZ7yW0uM6nR3}
    clock-skew-seconds: 60
